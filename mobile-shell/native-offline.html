<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#071326" />
    <title>Bazaar — нет сети</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071326; color: #f8fafc; }
      main { width: min(84vw, 360px); text-align: center; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      p { color: #a9b7cc; line-height: 1.55; }
      button { min-height: 48px; border: 0; border-radius: 12px; padding: 0 22px; background: #1677ff; color: white; font: inherit; font-weight: 700; }
      button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="icon.png" alt="Bazaar" />
      <h1>Нет подключения</h1>
      <p>Проверьте интернет и попробуйте снова. Несохранённые операции не считаются выполненными.</p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </main>
  </body>
</html>
