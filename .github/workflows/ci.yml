name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/playground

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify scanner failure handling
        run: node --test scripts/deployment/osv-results.test.mjs
      - name: Scan lockfile with OSV v2.3.0
        id: scanner
        # Exit 1 means findings; the report gate and reporter still must run.
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@9ca325867d8b4f9a3ccd4a0ca372e3cc7fcee3ef # v2.3.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --config=osv-scanner.toml
            --all-packages
            --format=json
            --output=osv-results.json
      - name: Require a real lockfile scan result
        id: verify-scan
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const report = JSON.parse(fs.readFileSync('osv-results.json', 'utf8'));
          assert(Array.isArray(report.results), 'OSV did not produce a results array');
          const scanned = report.results.find(result =>
            result.source?.type === 'lockfile' &&
            typeof result.source.path === 'string' &&
            path.basename(result.source.path) === 'pnpm-lock.yaml');
          // --all-packages includes clean dependencies too; [] is not proof of
          // scanning this nonempty lockfile. A clean scan has packages without vulnerabilities.
          assert(scanned && Array.isArray(scanned.packages) && scanned.packages.length > 0,
            'OSV did not scan the nonempty pnpm-lock.yaml');
          assert(scanned.packages.every(result =>
            typeof result.package?.name === 'string' &&
            typeof result.package.version === 'string'), 'OSV package inventory is malformed');
          console.log(`Verified OSV package inventory: ${scanned.packages.length} lockfile packages`);
          NODE
      - name: Report findings without hiding scanner failures
        id: reporter
        uses: google/osv-scanner-action/osv-reporter-action@9ca325867d8b4f9a3ccd4a0ca372e3cc7fcee3ef # v2.3.0
        with:
          scan-args: |-
            --new=osv-results.json
            --output=osv-results.sarif
            --gh-annotations=false
            --fail-on-vuln=true
      - name: Upload dependency scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-results
          path: |
            osv-results.json
            osv-results.sarif
          if-no-files-found: error
      - name: Upload dependency results to code scanning
        if: always() && steps.verify-scan.outcome == 'success' && steps.reporter.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@014f16e7ab1402f30e7c3329d33797e7948572db # v4.31.3
        with:
          sarif_file: osv-results.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - uses: github/codeql-action/analyze@v4

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [checks, catalog-scale]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: bazaar_hardening_ci
        ports:
          - 5432:5432
        # Each test truncates the full schema. Keep this disposable database off
        # runner disk to avoid checkpoint fsync stalls; PostgreSQL sync stays on.
        options: >-
          --tmpfs=/var/lib/postgresql/data:rw,size=2g
          --health-cmd="pg_isready -U inventory -d bazaar_hardening_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/bazaar_hardening_ci?schema=public
      DATABASE_TEST_URL: postgresql://inventory:inventory@localhost:5432/bazaar_hardening_ci?schema=public
      RUN_DB_TESTS: "1"
      ALLOW_TEST_DB_RESET: "1"
      EXPECTED_TEST_DB_NAME: bazaar_hardening_ci
      REDIS_URL: redis://localhost:6379/13
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations
        run: pnpm prisma:migrate
      - name: Verify public smoke transport offline
        run: node --test scripts/deployment/public-smoke.test.mjs
      - name: Run checks
        if: matrix.suite == 'checks'
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:ci
      - name: Verify 10,000 products and 100,000 prices in an isolated fresh database
        if: matrix.suite == 'catalog-scale'
        env:
          RUN_CATALOG_SCALE_TESTS: "1"
          NODE_OPTIONS: --max-old-space-size=512
        run: pnpm exec vitest run tests/integration/price-book-scale.test.ts
      - name: Verify database connection pooling and business transactions
        if: matrix.suite == 'checks'
        run: pnpm test:pooling
      - name: Verify movement A4 printing
        if: matrix.suite == 'checks'
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec tailwindcss -i src/app/globals.css -o /tmp/bazaar-print.css
          QA_PRINT_ONLY=1 QA_PRINT_CSS=/tmp/bazaar-print.css pnpm test:browser:print-navigation
          python3 -m pip install PyMuPDF==1.26.5
          python3 scripts/qa/verify-movement-pdfs.py artifacts/movement-print-command/latest
      - name: Upload movement print evidence
        if: always() && matrix.suite == 'checks'
        uses: actions/upload-artifact@v4
        with:
          name: movement-print-regression
          path: artifacts/movement-print-command/latest
          if-no-files-found: ignore

  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull disposable stabilization images
        run: docker compose -p bazaar-stabilization -f docker-compose.stabilization.yml pull
      - name: Run isolated stabilization checks
        run: pnpm test:stabilization
      - name: Tear down disposable stabilization services
        if: always()
        run: docker compose -p bazaar-stabilization -f docker-compose.stabilization.yml down --remove-orphans

  inventory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_agent2_inventory
        ports:
          - 55439:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56389:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify stock editing with two authenticated browser sessions
        run: node --import tsx scripts/inventory-audit/run.ts
      - name: Upload isolated stock browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-browser
          path: |
            artifacts/bazaar-stock-audit/browser.json
            artifacts/bazaar-stock-audit/*.png
            artifacts/bazaar-stock-audit/server.log

  baam-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_baam
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify BAAM roles, first click, focus and mobile layout
        run: node --import tsx scripts/baam/run.ts
      - name: Upload isolated BAAM browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baam-browser
          path: |
            artifacts/baam-companion/after
            artifacts/baam-companion/server.log

  ux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_ux
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Workspace UI roles, first click, focus and mobile layout
        run: node --import tsx scripts/ux/run.ts
      - name: Upload isolated Workspace UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser
          path: |
            artifacts/ux/after
            artifacts/ux/flows
            artifacts/ux/controls
            artifacts/ux/server.log

  reporting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_reporting
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify reporting calculations, drilldowns, exports, roles and responsive UI
        run: node --import tsx scripts/reporting/run.ts
      - name: Upload isolated reporting browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-browser
          path: |
            artifacts/reporting/after
            artifacts/reporting/states
            artifacts/reporting/server.log
            artifacts/directional/after

  landing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify restored landing, mobile navigation, themes and localized entry points
        run: node scripts/marketing/run.mjs
      - name: Upload landing screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser
          path: artifacts/bazaar-landing-restoration
          if-no-files-found: error

  native-android:
    runs-on: ubuntu-latest
    env:
      BAZAAR_MOBILE_ENV: production
      MOBILE_APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          # The legacy SDK "tools" package is no longer in Google's repository.
          packages: platform-tools
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and sync native project
        run: pnpm mobile:sync
      - name: Compile debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

  native-ios:
    runs-on: macos-15
    env:
      BAZAAR_MOBILE_ENV: production
      MOBILE_APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and sync native project
        run: pnpm mobile:sync
      - name: Compile iOS Simulator application
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build

  whatsapp-worker-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the standalone Linux WhatsApp worker without runtime secrets
        run: docker build --progress=plain -f Dockerfile.whatsapp-worker -t bazaar-whatsapp-worker:ci .
      - name: Verify isolated container startup, health, restart and graceful shutdown
        env:
          RUN_WHATSAPP_CONTAINER_SMOKE: "1"
        run: node scripts/qa/whatsapp-worker-container.mjs
      - name: Upload isolated worker-container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-worker-container
          path: artifacts/whatsapp-worker-container/
          if-no-files-found: warn

  release-gate:
    # A skipped aggregate job can be treated as passing by GitHub-backed checks.
    # Always report a failure unless every required job actually succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - dependency-security
      - codeql
      - native-android
      - native-ios
      - test
      - stabilization
      - inventory-browser
      - baam-browser
      - ux-browser
      - reporting-browser
      - landing-browser
      - whatsapp-worker-container
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory?schema=public
      ALLOW_LOCALHOST_DATABASE_IN_PRODUCTION: "true"
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      JOBS_SECRET: ci-jobs-secret
      CRON_SECRET: ci-cron-secret-20260808
      EMAIL_PROVIDER: resend
      EMAIL_FROM: no-reply@example.com
      RESEND_API_KEY: ci-resend-key
    steps:
      - name: Require successful prerequisites
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RELEASE_NEEDS_JSON ?? 'null');
          if (!needs || typeof needs !== 'object' || Array.isArray(needs)) {
            throw new Error('Release prerequisites are missing or invalid');
          }
          const jobs = Object.entries(needs);
          if (jobs.length === 0 || jobs.some(([, job]) => job?.result !== 'success')) {
            throw new Error('Every release prerequisite must finish with success');
          }
          console.log('All release prerequisites succeeded');
          NODE
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations
        run: pnpm prisma:migrate
      - name: Startup preflight
        run: pnpm ops:preflight
      - name: Build
        run: pnpm build
