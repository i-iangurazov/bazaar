name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-security:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --ignore-vuln=GHSA-2g4f-4pwh-qvx6
        --ignore-vuln=GHSA-67mh-4wv8-2f99
        --ignore-vuln=GHSA-4r6h-8v6p-xvw6
        --ignore-vuln=GHSA-5pgg-2g8v-p4x9

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - uses: github/codeql-action/analyze@v4

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: bazaar_hardening_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/bazaar_hardening_ci?schema=public
      DATABASE_TEST_URL: postgresql://inventory:inventory@localhost:5432/bazaar_hardening_ci?schema=public
      RUN_DB_TESTS: "1"
      ALLOW_TEST_DB_RESET: "1"
      EXPECTED_TEST_DB_NAME: bazaar_hardening_ci
      REDIS_URL: redis://localhost:6379/13
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations
        run: pnpm prisma:migrate
      - name: Verify public smoke transport offline
        run: node --test scripts/deployment/public-smoke.test.mjs
      - name: Run checks
        run: pnpm test:ci
      - name: Verify movement A4 printing
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec tailwindcss -i src/app/globals.css -o /tmp/bazaar-print.css
          QA_PRINT_ONLY=1 QA_PRINT_CSS=/tmp/bazaar-print.css pnpm test:browser:print-navigation
          python3 -m pip install PyMuPDF==1.26.5
          python3 scripts/qa/verify-movement-pdfs.py artifacts/movement-print-command/latest
      - name: Upload movement print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movement-print-regression
          path: artifacts/movement-print-command/latest
          if-no-files-found: ignore

  stabilization:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull disposable stabilization images
        run: docker compose -p bazaar-stabilization -f docker-compose.stabilization.yml pull
      - name: Run isolated stabilization checks
        run: pnpm test:stabilization
      - name: Tear down disposable stabilization services
        if: always()
        run: docker compose -p bazaar-stabilization -f docker-compose.stabilization.yml down --remove-orphans

  inventory-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_agent2_inventory
        ports:
          - 55439:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56389:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify stock editing with two authenticated browser sessions
        run: node --import tsx scripts/inventory-audit/run.ts
      - name: Upload isolated stock browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-browser
          path: |
            artifacts/bazaar-stock-audit/browser.json
            artifacts/bazaar-stock-audit/*.png
            artifacts/bazaar-stock-audit/server.log

  baam-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_baam
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify BAAM roles, first click, focus and mobile layout
        run: node --import tsx scripts/baam/run.ts
      - name: Upload isolated BAAM browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baam-browser
          path: |
            artifacts/baam-companion/after
            artifacts/baam-companion/server.log

  ux-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_ux
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify Workspace UI roles, first click, focus and mobile layout
        run: node --import tsx scripts/ux/run.ts
      - name: Upload isolated Workspace UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-browser
          path: |
            artifacts/ux/after
            artifacts/ux/flows
            artifacts/ux/server.log

  reporting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bazaar_test
          POSTGRES_PASSWORD: bazaar_test_only
          POSTGRES_DB: bazaar_hardening_reporting
        ports:
          - 55440:5432
        options: >-
          --health-cmd="pg_isready -U bazaar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 56390:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify reporting calculations, drilldowns, exports, roles and responsive UI
        run: node --import tsx scripts/reporting/run.ts
      - name: Upload isolated reporting browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-browser
          path: |
            artifacts/reporting/after
            artifacts/reporting/states
            artifacts/reporting/server.log

  landing-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify restored landing, mobile navigation, themes and localized entry points
        run: node scripts/marketing/run.mjs
      - name: Upload landing screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-browser
          path: artifacts/bazaar-landing-restoration
          if-no-files-found: error

  native-android:
    runs-on: ubuntu-latest
    env:
      BAZAAR_MOBILE_ENV: production
      MOBILE_APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and sync native project
        run: pnpm mobile:sync
      - name: Compile debug APK and unsigned release AAB
        working-directory: android
        run: ./gradlew assembleDebug bundleRelease

  native-ios:
    runs-on: macos-15
    env:
      BAZAAR_MOBILE_ENV: production
      MOBILE_APP_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and sync native project
        run: pnpm mobile:sync
      - name: Compile iOS Simulator application
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build

  release-gate:
    # A skipped aggregate job can be treated as passing by GitHub-backed checks.
    # Always report a failure unless every required job actually succeeded.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - dependency-security
      - codeql
      - native-android
      - native-ios
      - test
      - stabilization
      - inventory-browser
      - baam-browser
      - ux-browser
      - reporting-browser
      - landing-browser
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventory?schema=public
      ALLOW_LOCALHOST_DATABASE_IN_PRODUCTION: "true"
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      JOBS_SECRET: ci-jobs-secret
      CRON_SECRET: ci-cron-secret-20260808
      EMAIL_PROVIDER: resend
      EMAIL_FROM: no-reply@example.com
      RESEND_API_KEY: ci-resend-key
    steps:
      - name: Require successful prerequisites
        env:
          RELEASE_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.RELEASE_NEEDS_JSON ?? 'null');
          if (!needs || typeof needs !== 'object' || Array.isArray(needs)) {
            throw new Error('Release prerequisites are missing or invalid');
          }
          const jobs = Object.entries(needs);
          if (jobs.length === 0 || jobs.some(([, job]) => job?.result !== 'success')) {
            throw new Error('Every release prerequisite must finish with success');
          }
          console.log('All release prerequisites succeeded');
          NODE
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations
        run: pnpm prisma:migrate
      - name: Startup preflight
        run: pnpm ops:preflight
      - name: Build
        run: pnpm build
