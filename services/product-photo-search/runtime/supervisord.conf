[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/product-photo-supervisord.pid
childlogdir=/tmp

[program:encoder]
command=/usr/local/bin/python services/product-photo-search/compact_server.py --model-dir /app/models --vision-model-dir /app/models/vision --host 127.0.0.1 --port 3150 --threads 2 --snapshot-root /app/indexes
directory=/app
priority=10
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=35
environment=DATABASE_URL="",DATABASE_URL_UNPOOLED="",REDIS_URL="",NEXTAUTH_SECRET=""
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:indexer]
command=/usr/local/bin/node --import tsx scripts/product-photo-runtime-worker.mjs
directory=/app
priority=20
autorestart=unexpected
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=40
environment=PRODUCT_PHOTO_SEARCH_URL="http://127.0.0.1:3150"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:proxy]
command=/usr/bin/caddy run --config /app/services/product-photo-search/runtime/Caddyfile --adapter caddyfile
directory=/app
priority=30
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stopwaitsecs=30
environment=DATABASE_URL="",DATABASE_URL_UNPOOLED="",REDIS_URL="",NEXTAUTH_SECRET=""
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
