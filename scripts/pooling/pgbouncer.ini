[databases]
bazaar_hardening_ci = host=postgres port=5432 dbname=bazaar_hardening_ci

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/bazaar-pooling/users.txt
pool_mode = transaction
default_pool_size = 2
reserve_pool_size = 0
max_client_conn = 200
max_prepared_statements = 200
server_idle_timeout = 10
query_wait_timeout = 30
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
