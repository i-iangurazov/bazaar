services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bazaar_test
      POSTGRES_PASSWORD: bazaar_test_only
      POSTGRES_DB: bazaar_hardening_ci
    ports:
      - "127.0.0.1:55447:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./scripts/pooling/init.sql:/docker-entrypoint-initdb.d/pooling.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bazaar_test", "-d", "bazaar_hardening_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
  pooler:
    build: ./scripts/pooling
    command: ["/etc/bazaar-pooling/pgbouncer.ini"]
    volumes:
      - ./scripts/pooling:/etc/bazaar-pooling:ro
    ports:
      - "127.0.0.1:56447:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "bazaar_test", "-d", "bazaar_hardening_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56397:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
